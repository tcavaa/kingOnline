<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint into the safe-area regions
         (notch, home indicator) instead of being clipped at the visible bar
         edges. Combined with env(safe-area-inset-*) padding in CSS, this
         keeps the bottom HUD pills above the URL bar on iOS Safari. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8e2b23" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>კინგი — ქართული კარტის თამაში</title>
    <style>
      html, body { margin: 0; padding: 0; background: #3a2418; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
